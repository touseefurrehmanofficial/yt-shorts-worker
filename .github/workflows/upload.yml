name: upload-run

on:
  schedule:
    # 5h upload runs, 3h gaps, alternating with claims-run:
    # even days: 00:00 + 16:00 ; odd days: 08:00  (UTC)
    - cron: "0 0,16 * * 0,2,4,6"
    - cron: "0 8 * * 1,3,5"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Max uploads this run"
        required: true
        default: "5"
        type: string
      max_runtime:
        description: "Runtime budget in minutes"
        required: true
        default: "270"
        type: string

permissions:
  contents: write

concurrency:
  group: worker-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: windows-latest
    timeout-minutes: 310
    env:
      RUN_TYPE: upload
      BATCH_SIZE: ${{ inputs.batch_size || '10' }}
      MAX_RUNTIME: ${{ inputs.max_runtime || '270' }}
      YT_COOKIES: ${{ secrets.YT_COOKIES }}
      FB_COOKIES: ${{ secrets.FB_COOKIES }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          pip install -r requirements.txt
          python -m playwright install chromium

      - name: Run upload pipeline
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          python cloud/worker_run.py 2>&1 | Tee-Object -FilePath "logs/run_upload_$(Get-Date -Format 'yyyyMMdd_HHmmss').log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit state (reels.csv + logs)
        shell: pwsh
        run: |
          git config user.name "worker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/reels.csv logs/ 2>$null
          git commit -m "upload-run state $(Get-Date -Format 'yyyy-MM-dd HH:mm')" 2>$null
          git push origin HEAD 2>$null
          exit 0

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upload-logs
          path: |
            logs/
            data/reels.csv
          if-no-files-found: warn
          retention-days: 30
