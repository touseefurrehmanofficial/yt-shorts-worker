name: claims-run

on:
  schedule:
    # 5h claims runs, 3h gaps, alternating with upload-run:
    # odd days: 00:00 + 16:00 ; even days: 08:00  (UTC)
    - cron: "0 0,16 * * 1,3,5"
    - cron: "0 8 * * 0,2,4,6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: worker-claims
  cancel-in-progress: false

jobs:
  claims:
    runs-on: windows-latest
    timeout-minutes: 310
    env:
      RUN_TYPE: claims
      YT_COOKIES: ${{ secrets.YT_COOKIES }}
      FB_COOKIES: ${{ secrets.FB_COOKIES }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          pip install -r requirements.txt
          python -m playwright install chromium

      - name: Run claims checker
        shell: pwsh
        run: python cloud/worker_run.py

      - name: Commit state (reels.csv + logs)
        shell: pwsh
        run: |
          git config user.name "worker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/reels.csv logs/ 2>$null
          git commit -m "claims-run state $(Get-Date -Format 'yyyy-MM-dd HH:mm')" 2>$null
          git push origin HEAD 2>$null
          exit 0

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claims-logs
          path: |
            logs/
            data/reels.csv
          if-no-files-found: warn
          retention-days: 30
